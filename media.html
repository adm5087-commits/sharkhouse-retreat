<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sharkhouse &middot; Media</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f7f2e8;
    --sand-dark: #ede5d0;
    --ink: #1c1a16;
    --ink-light: #5a5448;
    --ocean: #2b5f75;
    --ocean-light: #4a8fa8;
    --coral: #c4614a;
    --rule: #d4c9b0;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sand);
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background: var(--ocean);
    color: white;
    text-align: center;
    padding: 40px 24px 32px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(74,143,168,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(43,95,117,0.6) 0%, transparent 60%);
  }
  .header-inner { position: relative; z-index: 1; }
  .header-eyebrow {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 4px;
    text-transform: uppercase; opacity: 0.7; margin-bottom: 8px;
  }
  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 300; line-height: 1; letter-spacing: -1px; margin-bottom: 6px;
  }
  .header-title em { font-style: italic; color: rgba(255,255,255,0.65); }
  .header-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; font-style: italic; opacity: 0.75;
  }
  .header-wave {
    position: absolute; bottom: -1px; left: 0; right: 0;
    height: 32px; background: var(--sand);
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  .back-link {
    position: absolute; top: 18px; left: 20px; z-index: 2;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(255,255,255,0.7);
    text-decoration: none; transition: color 0.15s;
  }
  .back-link:hover { color: white; }
  .back-link::before { content: '\2190 '; }

  .content {
    max-width: 900px;
    margin: 48px auto 80px;
    padding: 0 24px;
  }

  .section-eyebrow {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 4px;
    text-transform: uppercase; color: var(--ink-light);
    margin-bottom: 28px;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
  }
  @media (max-width: 500px) { .video-grid { grid-template-columns: 1fr; } }

  .video-card {
    border: 1.5px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    background: white;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .video-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.1);
  }

  .video-embed {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
  }
  .video-embed iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .video-info {
    padding: 14px 16px;
    border-top: 1px solid var(--rule);
  }
  .video-label {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 1px;
    color: var(--ink-light); text-transform: uppercase;
  }

  footer {
    text-align: center;
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink-light); padding: 24px; border-top: 1px solid var(--rule);
  }

  .site-nav { background: var(--ocean); display: flex; justify-content: center; padding: 0; position: sticky; top: 0; z-index: 100; }
  .site-nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-family: 'Jost', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; padding: 14px 16px; transition: color 0.15s, background 0.15s; }
  .site-nav a:hover { color: white; background: rgba(255,255,255,0.08); }
  .site-nav a.active { color: white; border-bottom: 2px solid rgba(255,255,255,0.5); }
  @media (max-width: 520px) { .site-nav a { padding: 12px 9px; font-size: 0.58rem; letter-spacing: 1.5px; } }
</style>
</head>
